<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>P01 v2 Architecture - AI Document Summarizer</title>
  <desc>Request flows left to right through User, Streamlit, API Gateway, Lambda. Lambda calls S3, SSM, and Bedrock. Summary returns via bottom path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; }
      .th { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .ts { font-size: 11px; fill: #555; }
      .c-gray rect   { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
      .c-teal rect   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
      .c-amber rect  { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
      .c-blue rect   { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
      .c-coral rect  { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
      .c-gray .th    { fill: #444441; }
      .c-teal .th    { fill: #085041; }
      .c-purple .th  { fill: #3C3489; }
      .c-amber .th   { fill: #633806; }
      .c-blue .th    { fill: #0C447C; }
      .c-coral .th   { fill: #712B13; }
      .c-gray .ts    { fill: #5F5E5A; }
      .c-teal .ts    { fill: #0F6E56; }
      .c-purple .ts  { fill: #534AB7; }
      .c-amber .ts   { fill: #854F0B; }
      .c-blue .ts    { fill: #185FA5; }
      .c-coral .ts   { fill: #993C1D; }
    </style>
  </defs>

  <rect width="680" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text class="th" x="340" y="26" text-anchor="middle" style="font-size:14px">P01 v2 - AI Document Summarizer</text>
  <text class="ts" x="340" y="42" text-anchor="middle">Serverless pipeline · Terraform + CloudFormation · Python 3.12</text>

  <!-- ROW 1: User, Streamlit, API Gateway, Lambda -->
  <g class="c-gray">
    <rect x="20" y="65" width="90" height="48" rx="8"/>
    <text class="th" x="65" y="84" text-anchor="middle" dominant-baseline="central">User</text>
    <text class="ts" x="65" y="102" text-anchor="middle" dominant-baseline="central">browser</text>
  </g>
  <line x1="110" y1="89" x2="148" y2="89" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="c-teal">
    <rect x="150" y="65" width="110" height="48" rx="8"/>
    <text class="th" x="205" y="84" text-anchor="middle" dominant-baseline="central">Streamlit</text>
    <text class="ts" x="205" y="102" text-anchor="middle" dominant-baseline="central">local UI</text>
  </g>
  <line x1="260" y1="89" x2="298" y2="89" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="c-purple">
    <rect x="300" y="65" width="110" height="48" rx="8"/>
    <text class="th" x="355" y="84" text-anchor="middle" dominant-baseline="central">API Gateway</text>
    <text class="ts" x="355" y="102" text-anchor="middle" dominant-baseline="central">REST POST</text>
  </g>
  <line x1="410" y1="89" x2="448" y2="89" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="450" y="65" width="110" height="48" rx="8"/>
    <text class="th" x="505" y="84" text-anchor="middle" dominant-baseline="central">Lambda</text>
    <text class="ts" x="505" y="102" text-anchor="middle" dominant-baseline="central">orchestrator</text>
  </g>

  <!-- Lambda to S3 -->
  <line x1="465" y1="113" x2="185" y2="218" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="300" y="178" text-anchor="middle">read file</text>

  <!-- Lambda to SSM -->
  <line x1="490" y1="113" x2="355" y2="218" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="430" y="158" text-anchor="middle">get model</text>

  <!-- Lambda to Bedrock -->
  <line x1="510" y1="113" x2="510" y2="218" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="528" y="168" text-anchor="start">invoke</text>

  <!-- ROW 2: S3, SSM, Bedrock -->
  <g class="c-blue">
    <rect x="80" y="220" width="160" height="48" rx="8"/>
    <text class="th" x="160" y="239" text-anchor="middle" dominant-baseline="central">Amazon S3</text>
    <text class="ts" x="160" y="257" text-anchor="middle" dominant-baseline="central">document storage</text>
  </g>

  <g class="c-coral">
    <rect x="280" y="220" width="150" height="48" rx="8"/>
    <text class="th" x="355" y="239" text-anchor="middle" dominant-baseline="central">SSM Param Store</text>
    <text class="ts" x="355" y="257" text-anchor="middle" dominant-baseline="central">model ID config</text>
  </g>

  <g class="c-teal">
    <rect x="450" y="220" width="160" height="48" rx="8"/>
    <text class="th" x="530" y="239" text-anchor="middle" dominant-baseline="central">Amazon Bedrock</text>
    <text class="ts" x="530" y="257" text-anchor="middle" dominant-baseline="central">Claude Haiku 4.5</text>
  </g>

  <!-- Return path: Bedrock bottom, left, up to User -->
  <path d="M530 268 L530 310 L65 310 L65 115" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="300" y="326" text-anchor="middle" fill="#1D9E75">summary response</text>

  <!-- Infrastructure row -->
  <line x1="40" y1="348" x2="640" y2="348" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 3"/>

  <rect x="50" y="360" width="130" height="34" rx="6" fill="none" stroke="#aaa" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="ts" x="115" y="381" text-anchor="middle">IAM least privilege</text>

  <rect x="205" y="360" width="150" height="34" rx="6" fill="none" stroke="#aaa" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="ts" x="280" y="381" text-anchor="middle">Terraform + CloudFormation</text>

  <rect x="380" y="360" width="130" height="34" rx="6" fill="none" stroke="#aaa" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="ts" x="445" y="381" text-anchor="middle">SSM model config</text>

  <rect x="530" y="360" width="110" height="34" rx="6" fill="none" stroke="#aaa" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="ts" x="585" y="381" text-anchor="middle">random_id S3</text>

  <!-- Footer -->
  <text class="ts" x="340" y="412" text-anchor="middle">github.com/prk-gen-ai-aws/genai-aws-p01-document-summarizer</text>
</svg>