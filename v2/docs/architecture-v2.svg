<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>P01 v2 Architecture — AI Document Summarizer</title>
  <desc>Complete data flow showing Streamlit, API Gateway, Lambda, S3, SSM Parameter Store, and Amazon Bedrock</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #333; }
      .th { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .ts { font-size: 11px; fill: #666; }
      .c-gray rect { fill: #F1EFE8; stroke: #888780; }
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-gray .th { fill: #444441; }
      .c-teal .th { fill: #085041; }
      .c-purple .th { fill: #3C3489; }
      .c-amber .th { fill: #633806; }
      .c-blue .th { fill: #0C447C; }
      .c-coral .th { fill: #712B13; }
      .c-gray .ts { fill: #5F5E5A; }
      .c-teal .ts { fill: #0F6E56; }
      .c-purple .ts { fill: #534AB7; }
      .c-amber .ts { fill: #854F0B; }
      .c-blue .ts { fill: #185FA5; }
      .c-coral .ts { fill: #993C1D; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text class="th" x="340" y="30" text-anchor="middle" style="font-size:14px">P01 v2 — AI Document Summarizer architecture</text>
  <text class="ts" x="340" y="48" text-anchor="middle">Serverless pipeline on AWS · Terraform + CloudFormation · Python 3.12</text>

  <!-- User -->
  <g class="c-gray">
    <rect x="30" y="80" width="100" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="80" y="100" text-anchor="middle" dominant-baseline="central">User</text>
    <text class="ts" x="80" y="118" text-anchor="middle" dominant-baseline="central">local browser</text>
  </g>

  <!-- Arrow: User → Streamlit -->
  <line x1="130" y1="105" x2="168" y2="105" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="149" y="98" text-anchor="middle">upload</text>

  <!-- Streamlit -->
  <g class="c-teal">
    <rect x="170" y="80" width="120" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="230" y="100" text-anchor="middle" dominant-baseline="central">Streamlit</text>
    <text class="ts" x="230" y="118" text-anchor="middle" dominant-baseline="central">runs locally</text>
  </g>

  <!-- Arrow: Streamlit → API GW -->
  <line x1="290" y1="105" x2="328" y2="105" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="309" y="98" text-anchor="middle">POST</text>

  <!-- API Gateway -->
  <g class="c-purple">
    <rect x="330" y="80" width="120" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="390" y="100" text-anchor="middle" dominant-baseline="central">API Gateway</text>
    <text class="ts" x="390" y="118" text-anchor="middle" dominant-baseline="central">REST /summarize</text>
  </g>

  <!-- Arrow: API GW → Lambda -->
  <line x1="450" y1="105" x2="488" y2="105" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="469" y="98" text-anchor="middle">invoke</text>

  <!-- Lambda -->
  <g class="c-amber">
    <rect x="490" y="80" width="120" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="550" y="100" text-anchor="middle" dominant-baseline="central">Lambda</text>
    <text class="ts" x="550" y="118" text-anchor="middle" dominant-baseline="central">orchestrator</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="160" x2="640" y2="160" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="ts" x="340" y="175" text-anchor="middle">AWS services</text>

  <!-- S3 -->
  <g class="c-blue">
    <rect x="80" y="200" width="140" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="150" y="220" text-anchor="middle" dominant-baseline="central">Amazon S3</text>
    <text class="ts" x="150" y="238" text-anchor="middle" dominant-baseline="central">document storage</text>
  </g>

  <!-- SSM -->
  <g class="c-coral">
    <rect x="270" y="200" width="140" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="220" text-anchor="middle" dominant-baseline="central">SSM Param Store</text>
    <text class="ts" x="340" y="238" text-anchor="middle" dominant-baseline="central">model ID config</text>
  </g>

  <!-- Bedrock -->
  <g class="c-teal">
    <rect x="460" y="200" width="140" height="50" rx="8" stroke-width="0.5"/>
    <text class="th" x="530" y="220" text-anchor="middle" dominant-baseline="central">Amazon Bedrock</text>
    <text class="ts" x="530" y="238" text-anchor="middle" dominant-baseline="central">Claude Haiku 4.5</text>
  </g>

  <!-- Lambda to S3 -->
  <path d="M550 130 L550 185 L150 185 L150 198" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="340" y="180" text-anchor="middle">read file</text>

  <!-- Lambda to SSM -->
  <path d="M550 130 L550 185 L340 185 L340 198" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Lambda to Bedrock -->
  <path d="M550 130 L550 198" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="568" y="168" text-anchor="start">invoke</text>

  <!-- Streamlit direct upload to S3 -->
  <path d="M230 130 L230 320 L148 320 L148 252" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="100" y="330" text-anchor="middle">direct upload</text>

  <!-- Return path (green) -->
  <path d="M610 200 L610 145 L552 145 L552 132" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490 140 L390 140 L390 132" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M330 140 L230 140 L230 132" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M170 140 L80 140 L80 132" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="340" y="137" text-anchor="middle" fill="#1D9E75">← summary response</text>

  <!-- IAM Role dashed -->
  <rect x="80" y="340" width="140" height="44" rx="8" fill="none" stroke="#aaa" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="th" x="150" y="358" text-anchor="middle" dominant-baseline="central" style="fill:#555">IAM Role</text>
  <text class="ts" x="150" y="374" text-anchor="middle" dominant-baseline="central">least privilege</text>

  <!-- IaC dashed -->
  <rect x="270" y="340" width="140" height="44" rx="8" fill="none" stroke="#aaa" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="th" x="340" y="358" text-anchor="middle" dominant-baseline="central" style="fill:#555">Terraform + CF</text>
  <text class="ts" x="340" y="374" text-anchor="middle" dominant-baseline="central">provisions all</text>

  <!-- random_id dashed -->
  <rect x="460" y="340" width="140" height="44" rx="8" fill="none" stroke="#aaa" stroke-dasharray="4 3" stroke-width="1"/>
  <text class="th" x="530" y="358" text-anchor="middle" dominant-baseline="central" style="fill:#555">random_id suffix</text>
  <text class="ts" x="530" y="374" text-anchor="middle" dominant-baseline="central">unique S3 naming</text>

  <!-- Legend -->
  <line x1="40" y1="440" x2="640" y2="440" stroke="#ccc" stroke-width="0.5"/>
  <line x1="60" y1="460" x2="90" y2="460" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="96" y="464" dominant-baseline="central">request flow</text>
  <line x1="200" y1="460" x2="230" y2="460" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="236" y="464" dominant-baseline="central" fill="#1D9E75">response / summary</text>
  <line x1="370" y1="460" x2="400" y2="460" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ts" x="406" y="464" dominant-baseline="central">infrastructure</text>
  <line x1="510" y1="460" x2="540" y2="460" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ts" x="546" y="464" dominant-baseline="central">direct upload</text>

  <!-- Footer -->
  <text class="ts" x="340" y="500" text-anchor="middle">github.com/prk-gen-ai-aws/genai-aws-p01-document-summarizer</text>
</svg>
